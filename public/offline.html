<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're offline — Life OS</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; align-items: center; justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f8fafc; color: #0f172a;
        }
        .card { max-width: 24rem; text-align: center; padding: 2rem; }
        .mark {
            width: 3rem; height: 3rem; border-radius: 0.75rem; background: #155DFC;
            margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center;
        }
        .mark span { width: 1.1rem; height: 1.1rem; border: 3px solid #fff; border-radius: 9999px; }
        h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
        p { font-size: 0.9rem; color: #64748b; margin: 0 0 1.25rem; }
        button {
            font: inherit; font-weight: 500; font-size: 0.875rem; color: #fff;
            background: #155DFC; border: none; border-radius: 0.5rem;
            padding: 0.5rem 1rem; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark"><span></span></div>
        <h1>You're offline</h1>
        <p>Life OS needs a connection to load your data safely — financial pages are never served from cache. Reconnect and try again.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
